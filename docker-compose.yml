version: '3.8'

# ==================== VARIABLES GLOBALES ====================
x-airflow-common:
  &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-tourisme-airflow:latest}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/data_lake:/opt/airflow/data_lake
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - tourisme-network

services:
  # ==================== FRONTEND (React + Nginx) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tourisme-frontend
    ports:
      - "80:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    depends_on:
      - backend
    networks:
      - tourisme-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== BACKEND (Node.js API) ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourisme-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/tourisme
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - FRONTEND_URL=http://frontend
      - PORT=3001
      - AIRFLOW_URL=http://airflow-webserver:8080
    depends_on:
      - mongodb
    networks:
      - tourisme-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== MONGODB ====================
  mongodb:
    image: mongo:7
    container_name: tourisme-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=tourisme
    networks:
      - tourisme-network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== AIRFLOW - WEBSERVER ====================
  airflow-webserver:
    <<: *airflow-common
    container_name: tourisme-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  # ==================== AIRFLOW - SCHEDULER ====================
  airflow-scheduler:
    <<: *airflow-common
    container_name: tourisme-airflow-scheduler
    command: scheduler
    restart: always

  # ==================== AIRFLOW - INIT ====================
  airflow-init:
    <<: *airflow-common
    container_name: tourisme-airflow-init
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    depends_on:
      postgres:
        condition: service_healthy

  # ==================== POSTGRES (Airflow Metadata) ====================
  postgres:
    image: postgres:13
    container_name: tourisme-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./airflow/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - tourisme-network
    restart: always

  # ==================== METABASE (BI/Analytics) ====================
  metabase:
    image: metabase/metabase:latest
    container_name: tourisme-metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_DB_TYPE: h2
    depends_on:
      - mongodb
    networks:
      - tourisme-network
    restart: always

# ==================== RÉSEAUX ====================
networks:
  tourisme-network:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  postgres-db-volume:
    driver: local
  metabase-data:
    driver: local
  data-lake-non-traitees:
    driver: local
  data-lake-traitees:
    driver: local
